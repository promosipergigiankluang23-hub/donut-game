<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Slasher - Primary School Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }
    #camera-video { display: none; }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror view */
    }
    #ui-bar {
      position: absolute;
      top: 15px;
      left: 25px;
      right: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 3px 10px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 5;
    }
    .score-badge { color: #facc15; font-size: 34px; }
    .timer-badge { color: #38bdf8; font-size: 34px; }
    .lives-badge { font-size: 30px; letter-spacing: 4px; }

    #overlay-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      z-index: 10;
    }
    h1 { font-size: 48px; margin: 0 0 10px 0; color: #f472b6; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
    p { font-size: 22px; margin: 6px 0; max-width: 650px; line-height: 1.4; }
    .gesture-box {
      margin-top: 25px;
      padding: 16px 32px;
      border: 3px dashed #facc15;
      border-radius: 20px;
      background: rgba(250, 204, 21, 0.15);
      font-size: 26px;
      font-weight: bold;
      color: #facc15;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>

  <!-- Google MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-bar">
    <div>🍬 SCORE: <span id="score-val" class="score-badge">0</span></div>
    <div>⏳ TIME: <span id="timer-val" class="timer-badge">02:00</span></div>
    <div>LIVES: <span id="lives-val" class="lives-badge">❤️❤️❤️❤️❤️</span></div>
  </div>

  <div id="overlay-screen">
    <h1 id="screen-title">SWEET FOOD SLASHER</h1>
    <p>🍩 🍰 🍬 <b>Slash Sweets Rapidly</b> = +5 Points</p>
    <p>🍌 🍎 <b>Avoid Banana & Apple</b> = Deducts 1 Life AND -10 Points!</p>
    <p>⏱️ You have <b>2 minutes</b> and <b>5 lives</b>.</p>
    <div id="screen-prompt" class="gesture-box">👍 SHOW BOTH HANDS THUMBS UP TO START 👍</div>
  </div>

  <div id="canvas-container">
    <video id="camera-video" playsinline></video>
    <canvas id="game-canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('camera-video');
    const scoreVal = document.getElementById('score-val');
    const timerVal = document.getElementById('timer-val');
    const livesVal = document.getElementById('lives-val');
    const overlay = document.getElementById('overlay-screen');
    const screenTitle = document.getElementById('screen-title');
    const screenPrompt = document.getElementById('screen-prompt');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gameState = 'WAITING';
    let score = 0;
    let lives = 5;
    let timeLeft = 120;
    let gameTimer = null;
    let sweetSpawner = null;
    let hazardSpawner = null;

    let items = [];
    let splitSlices = []; 
    let trails = []; 
    let activeKnives = [];
    let lastVideoFrame = null;

    const SWEET_TYPES = [
      { type: 'sweet', emoji: '🍩', radius: 46 },
      { type: 'sweet', emoji: '🍰', radius: 46 },
      { type: 'sweet', emoji: '🍬', radius: 40 }
    ];

    const HAZARD_TYPES = [
      { type: 'hazard', emoji: '🍌', radius: 50 },
      { type: 'hazard', emoji: '🍎', radius: 44 }
    ];

    // Single shared AudioContext for minimal latency
    let audioCtx = null;
    function playAudio(freq, type, dur) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }
    const soundSlash = () => playAudio(880, 'sine', 0.1);
    const soundHurt = () => playAudio(110, 'sawtooth', 0.25);

    function isThumbsUp(landmarks) {
      return (
        landmarks[4].y < landmarks[2].y - 0.08 &&
        landmarks[8].y > landmarks[6].y &&
        landmarks[12].y > landmarks[10].y &&
        landmarks[16].y > landmarks[14].y &&
        landmarks[20].y > landmarks[18].y
      );
    }

    function startGame() {
      score = 0;
      lives = 5;
      timeLeft = 120;
      items = [];
      splitSlices = [];
      trails = [];
      gameState = 'PLAYING';

      scoreVal.textContent = score;
      livesVal.textContent = '❤️'.repeat(lives);
      overlay.style.display = 'none';

      clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        timeLeft--;
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const secs = String(timeLeft % 60).padStart(2, '0');
        timerVal.textContent = `${mins}:${secs}`;

        if (timeLeft <= 0) endGame("TIME'S UP!");
      }, 1000);

      clearInterval(sweetSpawner);
      sweetSpawner = setInterval(() => {
        if (gameState === 'PLAYING') {
          const chosen = SWEET_TYPES[Math.floor(Math.random() * SWEET_TYPES.length)];
          spawnFood(chosen.type, chosen.emoji, chosen.radius);
        }
      }, 1200);

      clearInterval(hazardSpawner);
      hazardSpawner = setInterval(() => {
        if (gameState === 'PLAYING') {
          const chosen = HAZARD_TYPES[Math.floor(Math.random() * HAZARD_TYPES.length)];
          spawnFood(chosen.type, chosen.emoji, chosen.radius);
        }
      }, 5500);
    }

    function endGame(reason) {
      gameState = 'WAITING';
      clearInterval(gameTimer);
      clearInterval(sweetSpawner);
      clearInterval(hazardSpawner);

      screenTitle.innerHTML = `${reason}<br><span style="color:#facc15; font-size:42px;">TOTAL SCORE: ${score}</span>`;
      screenPrompt.innerHTML = "👍 NEXT PLAYER: SHOW BOTH HANDS THUMBS UP 👍";
      overlay.style.display = 'flex';
    }

    function spawnFood(type, emoji, radius) {
      items.push({
        type: type,
        emoji: emoji,
        radius: radius,
        x: Math.random() * (canvas.width - 240) + 120,
        y: canvas.height + 50,
        vx: (Math.random() - 0.5) * 4,
        vy: -(Math.random() * 3 + 13),
        rot: 0,
        vRot: (Math.random() - 0.5) * 0.08
      });
    }

    // High-performance slice effect without using costly ctx.clip()
    function spawnSlicedHalves(item) {
      splitSlices.push({
        emoji: item.emoji,
        x: item.x - 20,
        y: item.y,
        vx: item.vx - 3.5,
        vy: item.vy - 1,
        rot: item.rot,
        vRot: -0.15,
        radius: item.radius * 0.8,
        alpha: 1.0
      });
      splitSlices.push({
        emoji: item.emoji,
        x: item.x + 20,
        y: item.y,
        vx: item.vx + 3.5,
        vy: item.vy - 1,
        rot: item.rot,
        vRot: 0.15,
        radius: item.radius * 0.8,
        alpha: 1.0
      });
    }

    let thumbsUpHoldFrames = 0;

    // Receive MediaPipe Hand tracking results
    function onResults(results) {
      lastVideoFrame = results.image;
      const hands = results.multiHandLandmarks || [];
      activeKnives = [];

      if (gameState === 'WAITING' && hands.length >= 2) {
        if (isThumbsUp(hands[0]) && isThumbsUp(hands[1])) {
          thumbsUpHoldFrames++;
          if (thumbsUpHoldFrames > 15) {
            thumbsUpHoldFrames = 0;
            startGame();
          }
        } else {
          thumbsUpHoldFrames = 0;
        }
      }

      const now = performance.now();
      hands.forEach((hand) => {
        const tip = hand[8];
        const tipX = tip.x * canvas.width;
        const tipY = tip.y * canvas.height;
        activeKnives.push({ x: tipX, y: tipY });
        trails.push({ x: tipX, y: tipY, time: now });
      });

      trails = trails.filter(p => now - p.time < 100);
    }

    // Independent 60 FPS Game Loop
    function gameLoop() {
      // 1. Draw webcam feed
      if (lastVideoFrame) {
        ctx.drawImage(lastVideoFrame, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Draw Blade Trail
      if (trails.length > 1) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(trails[0].x, trails[0].y);
        for (let i = 1; i < trails.length; i++) {
          ctx.lineTo(trails[i].x, trails[i].y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // 3. Draw Dagger Icons
      activeKnives.forEach(pt => {
        ctx.font = '40px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🗡️', pt.x, pt.y);
      });

      // 4. Update Split Slices (Optimized, no clipping)
      for (let i = splitSlices.length - 1; i >= 0; i--) {
        const s = splitSlices[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.28;
        s.rot += s.vRot;
        s.alpha -= 0.015;

        ctx.save();
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.font = `${s.radius * 1.3}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.emoji, 0, 0);
        ctx.restore();

        if (s.y > canvas.height + 80 || s.alpha <= 0) splitSlices.splice(i, 1);
      }

      // 5. Update Flying Food & Slicing
      if (gameState === 'PLAYING') {
        const currentPt = trails.length > 0 ? trails[trails.length - 1] : null;
        const prevPt = trails.length > 2 ? trails[0] : null;
        const handSpeed = (currentPt && prevPt) ? Math.hypot(currentPt.x - prevPt.x, currentPt.y - prevPt.y) : 0;

        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.x += it.vx;
          it.y += it.vy;
          it.vy += 0.22;
          it.rot += it.vRot;

          ctx.save();
          ctx.translate(it.x, it.y);
          ctx.rotate(it.rot);
          ctx.font = `${it.radius * 1.6}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(it.emoji, 0, 0);
          ctx.restore();

          let hit = false;
          if (handSpeed > 14 && activeKnives.length > 0) {
            for (let k of activeKnives) {
              if (Math.hypot(k.x - it.x, k.y - it.y) < it.radius + 15) {
                hit = true;
                break;
              }
            }
          }

          if (hit) {
            if (it.type === 'sweet') {
              score += 5;
              scoreVal.textContent = score;
              playSlashSound();
              spawnSlicedHalves(it);
            } else if (it.type === 'hazard') {
              lives--;
              score = Math.max(0, score - 10);
              scoreVal.textContent = score;
              livesVal.textContent = '❤️'.repeat(Math.max(0, lives));
              soundHurt();

              if (lives <= 0) endGame("GAME OVER!");
            }
            items.splice(i, 1);
            continue;
          }

          if (it.y > canvas.height + 100) items.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // MediaPipe Hands with Model Complexity 0 (Fastest execution)
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0, // 0 = lowest latency, highest FPS
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    // Camera running at standard smooth resolution (640x480 for maximum FPS)
    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640,
      height: 480
    });
    camera.start();

    // Start 60 FPS animation loop
    requestAnimationFrame(gameLoop);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
