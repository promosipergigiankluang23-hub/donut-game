<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Healthy Food Basket Catcher</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      overflow: hidden;
      background: #0b0f19;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }
    #camera-video { display: none; }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #ui-bar {
      position: absolute;
      top: 15px;
      left: 25px;
      right: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 30px;
      font-weight: bold;
      text-shadow: 0 4px 12px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 5;
    }
    .score-badge { color: #facc15; font-size: 38px; }
    .timer-badge { color: #38bdf8; font-size: 38px; }
    .lives-badge { font-size: 32px; letter-spacing: 5px; }

    #overlay-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 15, 25, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      z-index: 10;
    }
    h1 { font-size: 50px; margin: 0 0 10px 0; color: #4ade80; text-shadow: 0 4px 16px rgba(74, 222, 128, 0.6); }
    p { font-size: 24px; margin: 8px 0; max-width: 650px; line-height: 1.4; }
    .gesture-box {
      margin-top: 25px;
      padding: 16px 36px;
      border: 3px dashed #facc15;
      border-radius: 20px;
      background: rgba(250, 204, 21, 0.2);
      font-size: 28px;
      font-weight: bold;
      color: #facc15;
      animation: pulse 1.5s infinite;
    }
    #error-banner {
      display: none;
      background: #ef4444;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 20px;
      margin-top: 15px;
      max-width: 80%;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-bar">
    <div>🧺 SCORE: <span id="score-val" class="score-badge">0</span></div>
    <div>⏳ TIME: <span id="timer-val" class="timer-badge">02:00</span></div>
    <div>LIVES: <span id="lives-val" class="lives-badge">❤️❤️❤️❤️❤️</span></div>
  </div>

  <div id="overlay-screen">
    <h1 id="screen-title">HEALTHY BASKET CATCHER</h1>
    <p>🧺 <b>Move your Basket</b> to catch falling food!</p>
    <p>🍎 🥛 🍌 🥦 <b>Collect Healthy Food</b> = +5 Points</p>
    <p>🍬 🍰 🍫 🍩 <b>Avoid Unhealthy Food</b> = Deducts 1 Life & -10 Points!</p>
    <p>⏱️ You have <b>2 minutes</b> and <b>5 lives</b>.</p>
    <div id="screen-prompt" class="gesture-box">⏳ CONNECTING CAMERA...</div>
    <div id="error-banner"></div>
  </div>

  <div id="canvas-container">
    <video id="camera-video" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('camera-video');
    const scoreVal = document.getElementById('score-val');
    const timerVal = document.getElementById('timer-val');
    const livesVal = document.getElementById('lives-val');
    const overlay = document.getElementById('overlay-screen');
    const screenTitle = document.getElementById('screen-title');
    const screenPrompt = document.getElementById('screen-prompt');
    const errorBanner = document.getElementById('error-banner');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gameState = 'WAITING';
    let score = 0;
    let lives = 5;
    let timeLeft = 120;
    let gameTimer = null;
    let foodSpawner = null;

    let items = [];
    let popups = [];
    let activeBaskets = [];
    let lastVideoFrame = null;

    const HEALTHY_ITEMS = [
      { type: 'healthy', emoji: '🍎', radius: 46, glow: '#22c55e', bg: 'rgba(34, 197, 94, 0.3)' },
      { type: 'healthy', emoji: '🥛', radius: 46, glow: '#38bdf8', bg: 'rgba(56, 189, 248, 0.3)' },
      { type: 'healthy', emoji: '🍌', radius: 48, glow: '#eab308', bg: 'rgba(234, 179, 8, 0.3)' },
      { type: 'healthy', emoji: '🥦', radius: 48, glow: '#10b981', bg: 'rgba(16, 185, 129, 0.3)' }
    ];

    const UNHEALTHY_ITEMS = [
      { type: 'unhealthy', emoji: '🍬', radius: 44, glow: '#f43f5e', bg: 'rgba(244, 63, 94, 0.35)' },
      { type: 'unhealthy', emoji: '🍰', radius: 50, glow: '#ec4899', bg: 'rgba(236, 72, 153, 0.35)' },
      { type: 'unhealthy', emoji: '🍫', radius: 46, glow: '#f97316', bg: 'rgba(249, 115, 22, 0.35)' },
      { type: 'unhealthy', emoji: '🍩', radius: 50, glow: '#ef4444', bg: 'rgba(239, 68, 68, 0.35)' }
    ];

    let audioCtx = null;
    function playAudio(freq, type, dur) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }
    const soundCollect = () => playAudio(620, 'sine', 0.12);
    const soundHurt = () => playAudio(130, 'sawtooth', 0.3);

    function isThumbsUp(landmarks) {
      return (
        landmarks[4].y < landmarks[2].y - 0.08 &&
        landmarks[8].y > landmarks[6].y &&
        landmarks[12].y > landmarks[10].y &&
        landmarks[16].y > landmarks[14].y &&
        landmarks[20].y > landmarks[18].y
      );
    }

    function startGame() {
      score = 0;
      lives = 5;
      timeLeft = 120;
      items = [];
      popups = [];
      gameState = 'PLAYING';

      scoreVal.textContent = score;
      livesVal.textContent = '❤️'.repeat(lives);
      overlay.style.display = 'none';

      clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        timeLeft--;
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const secs = String(timeLeft % 60).padStart(2, '0');
        timerVal.textContent = `${mins}:${secs}`;  if (timeLeft <= 0) endGame("TIME'S UP!"); }, 1000);  clearInterval(foodSpawner); foodSpawner = setInterval(() => { if (gameState !== 'PLAYING') return; const isHealthy = Math.random() < 0.70; const pool = isHealthy ? HEALTHY_ITEMS : UNHEALTHY_ITEMS; const picked = pool[Math.floor(Math.random() * pool.length)];  items.push({ type: picked.type, emoji: picked.emoji, radius: picked.radius, glow: picked.glow, bg: picked.bg, x: Math.random() * (canvas.width - 240) + 120, y: -50, vy: Math.random() * 2 + 4.5, vx: (Math.random() - 0.5) * 1.5 }); }, 1000); }  function endGame(reason) { gameState = 'WAITING'; clearInterval(gameTimer); clearInterval(foodSpawner);  screenTitle.innerHTML = `${reason}<br><span style="color:#facc15; font-size:44px;">TOTAL SCORE: ${score}</span>`; screenPrompt.innerHTML = "👍 NEXT PLAYER: SHOW BOTH HANDS THUMBS UP 👍"; overlay.style.display = 'flex'; }  let thumbsUpFrames = 0;  function onResults(results) { lastVideoFrame = results.image; const hands = results.multiHandLandmarks \vert{}\vert{} []; activeBaskets = [];  if (gameState === 'WAITING' && hands.length >= 2) { if (isThumbsUp(hands[0]) && isThumbsUp(hands[1])) { thumbsUpFrames++; if (thumbsUpFrames > 15) { thumbsUpFrames = 0; startGame(); } } else { thumbsUpFrames = 0; } }  hands.forEach(hand => { const palmCenter = hand[9]; activeBaskets.push({ x: palmCenter.x * canvas.width, y: palmCenter.y * canvas.height }); }); }  function render() { if (lastVideoFrame) { ctx.drawImage(lastVideoFrame, 0, 0, canvas.width, canvas.height); ctx.fillStyle = 'rgba(11, 15, 25, 0.45)'; ctx.fillRect(0, 0, canvas.width, canvas.height); } else { ctx.clearRect(0, 0, canvas.width, canvas.height); }  activeBaskets.forEach(b => { ctx.save(); ctx.shadowBlur = 18; ctx.shadowColor = '#facc15'; ctx.font = '80px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🧺', b.x, b.y); ctx.restore(); });  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.y -= 2.2; p.alpha -= 0.02;  ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha); ctx.shadowBlur = 10; ctx.shadowColor = p.color; ctx.font = 'bold 36px sans-serif'; ctx.fillStyle = p.color; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); ctx.restore();  if (p.alpha <= 0) popups.splice(i, 1); }  if (gameState === 'PLAYING') { for (let i = items.length - 1; i >= 0; i--) { const it = items[i]; it.y += it.vy; it.x += it.vx;  ctx.save(); ctx.shadowBlur = 24; ctx.shadowColor = it.glow; ctx.beginPath(); ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2); ctx.fillStyle = it.bg; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = it.glow; ctx.stroke();  ctx.shadowBlur = 14; ctx.shadowColor = '#000000'; ctx.font = `${it.radius * 1.55}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(it.emoji, it.x, it.y);
          ctx.restore();

          let caught = false;
          for (let b of activeBaskets) {
            if (Math.hypot(b.x - it.x, b.y - it.y) < 70) {
              caught = true;
              break;
            }
          }

          if (caught) {
            if (it.type === 'healthy') {
              score += 5;
              scoreVal.textContent = score;
              soundCollect();
              popups.push({ text: '+5', x: it.x, y: it.y, alpha: 1.0, color: '#4ade80' });
            } else {
              lives--;
              score = Math.max(0, score - 10);
              scoreVal.textContent = score;
              livesVal.textContent = '❤️'.repeat(Math.max(0, lives));
              soundHurt();
              popups.push({ text: '-10', x: it.x, y: it.y, alpha: 1.0, color: '#ef4444' });

              if (lives <= 0) endGame("GAME OVER!");
            }
            items.splice(i, 1);
            continue;
          }

          if (it.y > canvas.height + 70) items.splice(i, 1);
        }
      }

      requestAnimationFrame(render);
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    // Direct WebRTC Camera Initializer with Fallback
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
        });
        video.srcObject = stream;
        await video.play();

        screenPrompt.textContent = "👍 SHOW BOTH HANDS THUMBS UP TO START 👍";

        // Feed frames to MediaPipe
        async function processVideoFrame() {
          if (video.readyState >= 2) {
            await hands.send({ image: video });
          }
          requestAnimationFrame(processVideoFrame);
        }
        processVideoFrame();
      } catch (err) {
        console.error("Camera access error:", err);
        screenPrompt.textContent = "⚠️ CAMERA BLOCKED OR UNAVAILABLE";
        errorBanner.style.display = 'block';
        errorBanner.innerHTML = `Please allow camera access in your browser bar. (Error: ${err.name || err.message})`;
      }
    }

    startCamera();
    requestAnimationFrame(render);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
